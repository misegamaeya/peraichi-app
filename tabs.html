/* 10/20 案件ごとの会話。設計：共有メモ「ペライチ_案件ごとの会話_設計_1020.md」

const tkH=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };   /* 画面の本体の部品（h・kbE・gs）は本体の中に閉じていて見えないので、ここに小さく持つ */
const tkE=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tkHW=(typeof HW!=='undefined'&&HW)||window;
const tkErr=e=>String((e&&e.message)||e||'').replace(/^Exception:\s*/,'').slice(0,120);
const tkGs=(fn,...a)=>new Promise((ok,ng)=>{ const tm=setTimeout(()=>ng(new Error('時間がかかりすぎました')),150000);
  google.script.run.withSuccessHandler(x=>{ clearTimeout(tm); ok(x); }).withFailureHandler(e=>{ clearTimeout(tm); ng(e); })[fn](...a); });
const KB_ICO_TALK='<svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" focusable="false"><path fill="currentColor" d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9.5L5 21v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 6.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm5 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg>';
const TK_CHIPS=['何待ち？','次は？','急ぐ件は？'];
let TK=null;
function tkStoreGet(key){ try{ const v=JSON.parse(localStorage.getItem('pc_tk_'+key)||'null'); return v&&Array.isArray(v.log)?v.log:[]; }catch(e){ return []; } }
function tkStorePut(key,log){ try{ localStorage.setItem('pc_tk_'+key,JSON.stringify({at:Date.now(),log:log.slice(-60)})); }catch(e){} }
function tkNow(b){ const T=(b.list||[]).filter(x=>x.tag!=='good'&&x.hl), w=T.filter(x=>x.wait).length, nx=(b.line||[]).filter(x=>x.st==='plan'||x.st==='guess')[0];
  const P=[]; if(b.status) P.push('<p><b>様子</b>'+tkE(b.status)+'</p>');
  P.push('<p><b>残り</b>'+T.length+'件'+(w?'（待ち '+w+'件）':'')+(nx?'　<b>次</b>'+tkE(nx.k)+' '+tkE(nx.l):'')+'</p>');
  return '<div class="tk-now">'+P.join('')+'</div>'; }
function openTalk(b){ if(!b||!b.key) return; if(TK) closeTalk(true); const t0=performance.now(), key=b.key;

  document.body.append(W);
  const S=TK={W:W,key:key,b:b,log:tkStoreGet(key),busy:false,shut:false};

  const paint=()=>{ LG.textContent=''; S.log.forEach(x=>LG.append(bubble(x.r,x.t))); CH.hidden=S.busy; if(!CH.childNodes.length) TK_CHIPS.forEach(c=>{ const x=tkH('button','tk-chip',c); x.type='button'; x.onclick=()=>ask(c); CH.append(x); }); down(); };
  const fit=()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight+3,window.innerHeight*0.4)+'px'; send.disabled=S.busy||!ta.value.trim(); };
  const ask=(q)=>{ q=String(q||'').trim(); if(!q||S.busy) return; S.busy=true; const hist=S.log.slice(); S.log.push({r:'q',t:q,at:Date.now()}); tkStorePut(key,S.log);
    ta.value=''; fit(); paint(); const wt=tkH('div','tk-m tk-a tk-wait'); wt.innerHTML='考えています <i></i><i></i><i></i> <span></span>'; LG.append(wt); down();
    const a0=Date.now(), sp=wt.querySelector('span'), tm=setInterval(()=>{ const s=Math.round((Date.now()-a0)/1000); sp.textContent=s>=3?s+'秒':''; },500);

      .catch(e=>{ clearInterval(tm); if(S.shut) return; S.busy=false; const mine=S.log[S.log.length-1]; paint(); const m=tkErr(e);   /* 質問の吹き出しは残す（確かめ役） */
        const er=tkH('div','tk-err','送れませんでした（'+m+'）'); const rb=tkH('button','tk-re','もう一度'); rb.type='button'; rb.onclick=()=>{ er.remove(); const i=S.log.indexOf(mine); if(i>=0) S.log.splice(i,1); ask(q); }; er.append(rb); LG.append(er); fit(); down(); }); };
  form.onsubmit=e=>{ e.preventDefault(); ask(ta.value); };

  W.querySelector('.tk-x').onclick=()=>closeTalk();
  S.pop=()=>{ if(TK===S&&!(tkHW.history.state&&tkHW.history.state.tk)) closeTalk(true); };

  paint(); fit();
  tkGs('getTalk',key).then(r=>{ if(S.shut) return; if(r&&r.noKey&&!W.querySelector('.tk-key')){ const k=tkH('div','tk-key'); k.append(tkH('span',null,'AIの鍵がまだありません')); if(r.noKey.url){ const a=tkH('a',null,'鍵を入れる'); a.href=r.noKey.url; a.target='_blank'; a.rel='noopener'; k.append(a); } else k.lastChild.textContent='AIの鍵がまだありません（社長に入れてもらってください）'; W.querySelector('.tk-in').prepend(k); }   /* 10/20 統括：押せばすぐ鍵を入れる画面 */
    if(S.busy) return; const L=(r&&r.log)||[]; if(L.length||!S.log.length){ S.log=L; tkStorePut(key,L); paint(); } }).catch(()=>{});   /* 読めなくても、端末の写しのまま話せる */
  if(window.matchMedia('(hover:hover) and (pointer:fine)').matches) ta.focus(); }
function closeTalk(fromPop){ const S=TK; if(!S) return; S.shut=true; TK=null; S.W.remove(); tkHW.removeEventListener('popstate',S.pop);
  if(!fromPop){ try{ if(tkHW.history.state&&tkHW.history.state.tk) tkHW.history.back(); }catch(e){} } }
/* ボタン：案件ボードの見出しのマーク（ドライブ・マップ）の並びの最後に1つ足す。ボードを描くたびに足す（tabs.html の描き方は変えない）。ボードの中身はボードの .kb に付いている（R.__b） */
function tkAddBtn(root){ (root||document).querySelectorAll('.kb .k-stick.k-case .k-hbtn').forEach(hb=>{ if(hb.querySelector('.k-talk')) return; const R=hb.closest('.kb'); if(!R||!R.__b) return;
  const bt=tkH('button','k-ico k-talk'); bt.type='button'; bt.title='この案件について聞く'; bt.setAttribute('aria-label','この案件について聞く'); bt.innerHTML=KB_ICO_TALK; bt.onclick=()=>openTalk(R.__b); hb.append(bt); }); }
new MutationObserver(ms=>{ for(const m of ms){ for(const n of m.addedNodes){ if(n.nodeType===1&&(n.matches('.kb,.n-cp,.in')||n.querySelector&&n.querySelector('.k-hbtn'))){ tkAddBtn(n.parentNode||document); return; } } } }).observe(document.body,{childList:true,subtree:true});
window.addEventListener('keydown',e=>{ if(TK&&e.key==='Escape'){ e.stopImmediatePropagation(); e.preventDefault(); closeTalk(); } },true);   /* Esc は会話だけ閉じる（ボードの Esc より先に受ける） */
</script>
