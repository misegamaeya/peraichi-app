}

class NetErr extends Error{}
async function post(body,ms,site,keep){
  const url=CFG.gate[site||(auth&&auth.site)]; if(!url) throw new Error('入口がまだできていません');
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(),ms||45000);
  const bs=JSON.stringify(body); let r; try{ r=await fetch(url,{ method:'POST', body:bs, signal:ac.signal, keepalive:!!keep&&bs.length<60000 }); }    catch(e){ throw new NetErr('通信できませんでした'); } finally{ clearTimeout(t); }
  let j; try{ j=await r.json(); }catch(e){ throw new NetErr('答えが読めませんでした（'+r.status+'）'); }
  if(j&&j.ng==='key'){ lostKey(j.msg); throw new Error(j.msg||'鍵が使えません'); }
  return j;
}

const GATE_NG=/^ペライチにつながりませんでした/, RETRY_GAP=[5000,15000]; let checking=false, again=false;
async function check(force){
  if(!auth||AS) return; if(checking){ if(force) again=true; return; } checking=true;   
  try{
  if(!st.kind||st.kind==='err') setSt('checking');
  await flush();
  let j=null;
  for(let i=0;i<=RETRY_GAP.length;i++){
    if(i){ setSt('connecting'); await new Promise(f=>setTimeout(f,RETRY_GAP[i-1])); if(!auth) return; }
    let e0=null; try{ j=await post({ op:'page', key:auth.key, stamp:(page&&page.stamp)||'' },90000); }catch(e){ e0=e; j=null; }
    if(e0&&!(e0 instanceof NetErr)){ if(auth) setSt('err',e0.message); return; }
    if(j&&!(j.ng&&GATE_NG.test(j.ng))) break;
  }
  if(!j||(j.ng&&GATE_NG.test(j.ng))){ if(auth) setSt('err','少し時間をおいて開き直してください'); return; }
  if(j.ng){ setSt('err',j.ng); return; }
  if(j.same){ const uiChg=(j.ui||'')!==(page.ui||'')||(!!j.staff&&!page.staff); page.checked=j.at; page.ui=j.ui||''; if(j.staff) page.staff=j.staff; LS.set('page',page); setSt('ok'); if(!frame){ try{ await render(page); }catch(e){ setSt('err','画面を読み込めませんでした'); } return; } if(force||uiChg) render(page); return; }   
  const np={ data:j.data, done:j.done, name:j.name, hasAi:j.hasAi, admin:j.admin, stamp:j.stamp, at:j.at, checked:j.at, ui:j.ui||'', staff:j.staff||(page&&page.staff)||null, bt:Number(j.bt)||0 };
  if(!sane(np)){ setSt('err','受け取った中身が読めませんでした'); call('logClientError',['アプリ：受け取った中身が読めない']).catch(()=>{}); return; }
  if(j.stale&&page&&!(np.bt&&np.bt>=(page.bt||0))){ setSt('building'); if(polls++<10) setTimeout(()=>check(false),30000); return; }   
  if(j.stale&&page&&np.data===page.data&&np.done===page.done){ page.checked=j.at; LS.set('page',page); setSt('building'); if(polls++<10) setTimeout(()=>check(false),30000); return; }   
  LS.set('page',np);
  if(!page||force||!touched){ page=np; try{ await render(page); }catch(e){ setSt('err','画面を読み込めませんでした'); return; } setSt(j.stale?'building':'ok'); }
  else { pending=np; page.checked=j.at; setSt('new'); }
  if(j.stale&&polls++<10) setTimeout(()=>check(false),30000);
  } finally { checking=false; if(again){ again=false; setTimeout(()=>check(true),0); } }
}

  const go=h('button','sub','数字で設定する'); dt.append(h('div','note','Googleの画面のいちばん下「アプリにする（数字を出す）」で出た6けた'),inp,go); S.append(dt);
  dt.hidden=true; function later(){ setTimeout(()=>{ dt.hidden=false; },45000); }   
  go.onclick=async()=>{ const code=inp.value.replace(/\D/g,''); if(code.length!==6){ m.className='msg bad'; m.textContent='6けたの数字を打ってください'; return; }
    go.disabled=true; m.className='msg'; m.textContent='確かめています…';
    try{ await pairDone(await post({ op:'pair', code:code, dev:devName() },45000,code.charAt(0)==='9'?'owner':'staff'), code.charAt(0)==='9'?'owner':'staff'); }
    catch(e){ go.disabled=false; m.className='msg bad'; m.textContent=e.message||'設定できませんでした'; } };
  const pw=LS.get('pair'); if(pw&&Date.now()-pw.at<600000){ waitPair(); later(); }
}

const GMARK='<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
const rhex=()=>{ const a=new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); };
function gStart(){
  const g={ nonce:rhex(), state:rhex(), at:Date.now() }; LS.set('glogin',g);
  const back=location.origin+location.pathname.replace(/index\.html$/,''),     q=new URLSearchParams({ client_id:CFG.google, redirect_uri:back, response_type:'id_token', scope:'openid email', nonce:g.nonce, state:g.state, prompt:'select_account' });
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+q.toString(); }

async function gBack(){
  window.__glogging=true;   
  const hp=new URLSearchParams(location.hash.slice(1)); if(!hp.get('id_token')&&!hp.get('error')) return false;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  const g=LS.get('glogin'); LS.del('glogin');
  if(hp.get('error')){ showSetup('ログインをやめました。もう一度「Googleでログイン」を押してください'); return true; }
  if(!g||g.state!==hp.get('state')||Date.now()-g.at>600000){ showSetup('ログインをやり直してください（時間がたったか、別の画面から戻りました）'); return true; }
  $('setup').hidden=true; $('boot').hidden=false; $('boot').textContent='ログインしています…';
  try{ let site='staff', j=await post({ op:'glogin', idt:hp.get('id_token'), nonce:g.nonce, dev:devName() },45000,site);
    if(j&&j.go==='owner'){ site='owner'; j=await post({ op:'glogin', idt:hp.get('id_token'), nonce:g.nonce, dev:devName() },45000,site); }
    await pairDone(j,site); }
  catch(e){ showSetup((e instanceof NetErr)?'いま、つながりませんでした。電波を確かめて、もう一度「Googleでログイン」を押してください':(e.message||'ログインできませんでした')); }
  return true; }

const who=()=>!auth||!auth.name?'':auth.name==='社長'?'胡内（社長）の':auth.name+'さんの';
const devName=()=>(navigator.userAgent.match(/iPhone|iPad|Android|Macintosh|Windows/)||['?'])[0];
async function pairDone(j,site){
  if(!j||!j.ok) throw new Error((j&&j.ng)||'設定できませんでした');
  auth={ key:j.key, site:j.site||site, name:j.name||'' }; LS.set('auth',auth); LS.del('pair'); LS.del('page'); page=null;
  $('setup').hidden=true; $('boot').hidden=false; bootT0=Date.now(); setSt('checking'); check(true);
}

let pairT=null;
function waitPair(){
  
  clearTimeout(pairT); const pw=LS.get('pair'), m=document.querySelector('#setup .msg'); if(!pw){ if(!auth&&LS.get('auth')) location.reload(); return; }
  if(Date.now()-pw.at>600000){ LS.del('pair'); if(m){ m.className='msg bad'; m.textContent='10分を過ぎました。もう一度「はじめる」を押してください'; } return; }
  if(m){ m.className='msg'; m.textContent='つながるのを待っています…'; }
  
  const ask=site=>post({ op:'pair', token:pw.token, dev:devName() },20000,site).then(j=>({site,j}),e=>({site,e}));
  Promise.all(['staff','owner'].map(ask)).then(rs=>{ const ok=rs.find(r=>r.j&&!r.j.wait); if(ok) return pairDone(ok.j,ok.site);
      if(rs.some(r=>r.j&&r.j.wait)||rs.every(r=>r.e instanceof NetErr)){ pairT=setTimeout(waitPair,2000); return; }
      const er=rs.find(r=>r.e); throw er?er.e:new Error('設定できませんでした'); })
    .catch(e=>{ if(e instanceof NetErr){ pairT=setTimeout(waitPair,3000); return; } LS.del('pair'); if(m){ m.className='msg bad'; m.textContent=e.message||'設定できませんでした'; } });
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!auth&&LS.get('pair')) waitPair(); });


if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').then(r=>{ const up=()=>{ try{ r.update(); }catch(e){} }; up(); setInterval(up,300000); window.addEventListener('focus',up); }).catch(()=>{}); }    

if('serviceWorker' in navigator){ let once=false, later=false; const swap=()=>{ if(once||window.__glogging||hitoWin()) return; once=true; location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!auth){ swap(); return; } later=true; if(document.hidden) swap(); });
  document.addEventListener('visibilitychange',()=>{ if(later&&document.hidden) swap(); });
   
  setInterval(()=>{ if(!later||Date.now()-touchAt<20000||Q.all().length) return; let w=null, ok=false; try{ w=frame&&frame.contentWindow; ok=!!(w&&w.__kbzQuiet&&w.__kbzQuiet()); }catch(e){} if(!ok) return; try{ w.__kbzSave(); }catch(e){} swap(); },5000); }       
if(!auth&&CFG.google&&/(^#|&)(id_token|error)=/.test(location.hash)){ gBack(); return; }   
if(!auth||!CFG.gate[auth.site]){ showSetup(); return; }
if(page&&sane(page)){ setSt('checking'); render(page).then(()=>check(false),()=>{ setSt('err','画面を読み込めませんでした'); check(true); }); }
else { page=null; bootT0=Date.now(); setSt('checking'); check(true); }
})();
</script>
