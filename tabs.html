let SAMPLE=null;
const ROLE='あなたは京都の住宅リノベ会社（有限会社ミセガマエヤ）の社長、胡内義和さんの相談相手です。日本語で、短く具体的に答えます。事実が分からないことは推測で決めつけず、確かめることとして挙げます。';
const RULES='LINEの文を頼まれたら（「◯◯さんに任せる文にして」「返信の文を作って」「催促の文」など）、LINEにそのまま貼れる文だけを書く（前置きや説明は付けない）。です・ます調で短く、理由を1行添える。確かめていない日程・金額・約束は足さず、決まっていないところは（　　）にする。任せる文は「◯◯さん」＋何を＋いつまでに＋いつ報告してほしいか（相手が分からなければ「◯◯さん」のまま）。返信の文は、受け取ったこと＋次にどうするか。相談には、短く具体的に答える。';

    const w=window.open('about:blank','_blank'); T.ans.textContent='LINEの前後のやり取りを読んでいます…';
    let ctx=''; try{ ctx=await gs('talkText',T.key); }catch(e){ ctx=T.ctx.slice(0,1200)+'\n（※LINEの前後のやり取りは読めませんでした）'; }
    const text=ROLE+'\n'+'「▼」より下の発言がいちばん新しい状態です。済んだことを、これからやることとして勧めないでください。'+'\n\n'+RULES+(T.judge?'\n\n'+ASK1:'')+'\n\n'+ctx+'\n\n社長の言葉：'+q;

// パソコン：マウスでつかんで横に払う・回転で横に動く（押したことにはしない）
function dragScroll(el){ let down=0,moved=0,x0=0,s0=0,lx=0,lt=0,v=0,raf=0;
  el.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse'||e.button!==0) return; down=1; moved=0; x0=lx=e.clientX; s0=el.scrollLeft; lt=performance.now(); v=0; cancelAnimationFrame(raf); });
  addEventListener('pointermove',e=>{ if(!down) return; const dx=e.clientX-x0; if(Math.abs(dx)>4) moved=1; el.scrollLeft=s0-dx; const now=performance.now(); if(now>lt) v=v*0.4+0.6*(e.clientX-lx)/(now-lt); lx=e.clientX; lt=now; });
  addEventListener('pointerup',()=>{ if(!down) return; down=0; setTimeout(()=>{moved=0;},60); if(performance.now()-lt>80) v=0; let vel=v*16; const step=()=>{ if(Math.abs(vel)<0.3) return; el.scrollLeft-=vel; vel*=0.95; raf=requestAnimationFrame(step); }; raf=requestAnimationFrame(step); });
  el.addEventListener('click',e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=0; } },true);
  el.addEventListener('wheel',e=>{ if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return; const max=el.scrollWidth-el.clientWidth, n=Math.max(0,Math.min(max,el.scrollLeft+e.deltaY)); if(n!==el.scrollLeft){ el.scrollLeft=n; e.preventDefault(); } },{passive:false}); }

    b.onclick=()=>{ if(f==='memo'){ row.hidden=true; const a=h('div','ask'); const i=h('input'); i.placeholder='何を決めた？理由もひとこと'; const g=h('button','doneok','残す'); g.type='button'; a.append(i,g); t.append(a); i.focus(); clearTimeout(TOAST_T);
        const go3=()=>{ const v=i.value.trim(), cur=DONE[k]; if(v&&cur) save(k,Object.assign({},cur,{memo:v})); close(); }; g.onclick=go3; i.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing) go3(); }); return; }
      if(f()) close(); }; });
  if(row.childNodes.length) t.append(row); document.body.append(t); TOAST=t;
  if(stay){ t.classList.add('stay'); const off=e=>{ if(!t.isConnected){ document.removeEventListener('click',off,true); return; } if(t.contains(e.target)||!e.target.closest('button,a,[data-act],[data-pact],select,input,textarea')) return; document.removeEventListener('click',off,true); close(); }; setTimeout(()=>document.addEventListener('click',off,true),0); return; }   /* 10/17 統括：外したあとの「元に戻す」は、次に何かを押すか開き直すまで残す */
  t.addEventListener('pointerdown',()=>later(20000)); later(10000); }

const waitImport=(since)=>{ const tick=async()=>{ const sec=Math.max(0,Math.round((Date.now()-since)/1000)), m=Math.floor(sec/60), el=sec<60?sec+'秒':m+'分';

// ── 2本指で拡大・縮小（第48版・10/11 社長「PDFや画像のように拡大・縮小。目が悪い人でも、文字を大きくしすぎずに読める」）──
//  アプリは画面を内側の枠（iframe）に出すので、ふつうのピンチが効かないことがある。中身（#page）だけを、折り返しを変えずに拡大し、縦横に動かせるようにする。
//  指を動かしている間は絵として拡大（軽い）、指を離したときに本当の大きさに直す。上の帯・下のボタン・下から出る窓は大きくしない。1.05倍より小さければ元に戻す
{ const MIN=1, MAX=3; let z=1, base=0, g=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY), mid=t=>[(t[0].clientX+t[1].clientX)/2,(t[0].clientY+t[1].clientY)/2];
  const org=()=>{ const r=P.getBoundingClientRect(); return [r.left+scrollX, r.top+scrollY]; };   // 中身の左上（ページの中の位置）
  const setZ=(nz,fx,fy)=>{ const [ox,oy]=org(), px=(scrollX+fx-ox)/z, py=(scrollY+fy-oy)/z;   // 指の下にある中身の点
    z=nz<1.05?1:Math.min(MAX,nz);
    if(z===1){ P.style.zoom=''; P.style.width=''; document.body.style.minWidth=''; } else { P.style.width=base+'px'; P.style.zoom=String(z); document.body.style.minWidth=Math.ceil(base*z+2*Math.max(0,P.offsetLeft))+'px'; }
    document.documentElement.classList.toggle('zoomed',z!==1);
    const [ox2,oy2]=org(); scrollTo(Math.max(0,px*z+ox2-fx), Math.max(0,py*z+oy2-fy)); };
  document.addEventListener('touchstart',e=>{ if(e.touches.length!==2||CP) return; if(z===1) base=P.getBoundingClientRect().width; const [fx,fy]=mid(e.touches); g={d:dist(e.touches),fx,fy,r:1}; const [ox,oy]=org(); P.style.transformOrigin=((scrollX+fx-ox)/z)+'px '+((scrollY+fy-oy)/z)+'px'; },{passive:true});
  document.addEventListener('touchmove',e=>{ if(!g||e.touches.length!==2) return; e.preventDefault(); const r=Math.max(MIN/z,Math.min(MAX/z,dist(e.touches)/g.d)); g.r=r; P.style.transform='scale('+r+')'; },{passive:false});
  const end=()=>{ if(!g) return; const r=g.r, fx=g.fx, fy=g.fy; g=null; P.style.transform=''; P.style.transformOrigin=''; if(Math.abs(r-1)>0.01) setZ(z*r,fx,fy); };
  document.addEventListener('touchend',e=>{ if(e.touches.length<2) end(); },{passive:true}); document.addEventListener('touchcancel',end,{passive:true});
  ['gesturestart','gesturechange'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));   // iPhone の Safari で、ふつうのピンチと二重に動かない
  addEventListener('resize',()=>{ if(z!==1&&!g) setZ(1,0,0); });   // 横向きにしたときは元に戻す
  window.__zoom=(nz,fx,fy)=>{ if(z===1) base=P.getBoundingClientRect().width; setZ(nz,fx||0,fy||0); return z; };   // 試し用
}
// ── 上の帯：下へ読み進めると隠れ、少し戻すと出る（第48版・10/11 社長「ウェブでよくあるあの動き」）──
//  案件のタブ・下のタブは、帯が出ているときは帯の下に、隠れているときは画面のいちばん上に貼り付く（--st）。
//  隠さないとき：いちばん上の近く・知らせ（保存できなかった等）が出ている・案件のページや下から出る窓を開いている
{ let lastY=scrollY, hid=false, tick=false; const TBW0=document.querySelector('.n-tbw');
  const setTH=()=>{ if(TBW0) document.documentElement.style.setProperty('--th',TBW0.offsetHeight+'px'); };
  const setHid=(v)=>{ if(v===hid) return; hid=v; hdr.classList.toggle('hid',v); if(v) document.documentElement.style.setProperty('--st','0px'); else document.documentElement.style.removeProperty('--st'); };   // 出ているときは帯の高さ（--hh。知らせが出て帯が伸びても合う）
  const keep=()=>{ const m=document.getElementById('relmsg'); return (m&&!m.hidden)||!!document.querySelector('.n-cp,.n-sheet,.gn-modal,.ks-wrap'); };
  const run=()=>{ tick=false; const y=scrollY, dy=y-lastY; if(Math.abs(dy)<6&&y>hdr.offsetHeight) return; lastY=y;
    if(y<=hdr.offsetHeight*2||dy<0||keep()) setHid(false); else if(dy>0) setHid(true); };
  addEventListener('scroll',()=>{ if(!tick){ tick=true; requestAnimationFrame(run); } },{passive:true});
  addEventListener('resize',setTH); setTH();
  window.__hdr=()=>({hid, st:getComputedStyle(document.documentElement).getPropertyValue('--st'), th:getComputedStyle(document.documentElement).getPropertyValue('--th')});   // 試し用
}
