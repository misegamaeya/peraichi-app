<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="すっきりナビ">
<meta name="theme-color" content="#0F1117">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>すっきりナビ</title>
<!-- ペライチのアプリ（第45版・10/10）。外枠：前回の中身をすぐ出し、最新は裏で取りに行く。押した件は「送る待ちの列」に残してから送る。
     中身（お客様名・件）はこのファイルには無い。鍵のある人にだけ Google（入口 → 今のペライチ）から届く -->
<style>
:root{ --bg:#0F1117; --ink:#EEF0F5; --sub:#9AA0B0; --line:#2A2F3D; --accent:#5B8CFF; --warn:#FFB020; --bad:#FF6680; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
iframe.pg{ position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
#boot{ padding:calc(env(safe-area-inset-top) + 40px) 20px 20px; text-align:center; color:var(--sub); font-size:15px; }
#setup{ max-width:480px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 24px) 16px 40px; line-height:1.7; }
#setup h1{ font-size:22px; margin:0 0 6px; }
#setup ol{ padding-left:1.4em; margin:10px 0 16px; }
#setup li{ margin:6px 0; }
#setup .note{ color:var(--sub); font-size:14px; }
#setup button{ font:inherit; font-size:17px; border:0; border-radius:10px; padding:12px 16px; background:var(--accent); color:#fff; width:100%; margin:6px 0; }
#setup button.sub{ background:transparent; color:var(--accent); border:1px solid var(--line); font-size:15px; }
#setup input{ font:inherit; font-size:30px; letter-spacing:8px; text-align:center; width:100%; box-sizing:border-box; padding:10px; border-radius:10px; border:1px solid var(--line); background:#171A23; color:var(--ink); margin:6px 0; }
#setup .msg{ min-height:1.6em; font-size:15px; }
#setup .msg.bad{ color:var(--bad); }
#setup .box{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:14px 0; background:#151821; }
/* 10/16：ホーム画面に置く説明（絵つき） */
#setup .lead{ font-size:17px; font-weight:700; margin:4px 0 2px; }
#setup .big{ font-size:18px; font-weight:700; }
#setup .pic{ display:block; width:100%; max-width:340px; height:auto; margin:10px auto 2px; }
#setup .or{ border-top:1px dashed var(--line); margin-top:12px; padding-top:10px; }
#setup .app{ display:flex; align-items:center; gap:12px; margin-top:10px; }
#setup .app img{ width:56px; height:56px; border-radius:13px; }
#setup .url{ font-size:14px; letter-spacing:0; text-align:left; padding:8px 10px; }
#setup .ok{ color:#7BD88F; }
.point{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 12px); transform:translateX(-50%); z-index:5; display:flex; flex-direction:column; align-items:center; color:var(--accent); font-weight:700; font-size:15px; pointer-events:none; background:rgba(15,17,23,.88); border-radius:12px; padding:2px 12px 0; animation:bob 1.1s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ translate:0 0; } 50%{ translate:0 8px; } }
@media (prefers-reduced-motion:reduce){ .point{ animation:none; } }
</style>
<script src="config.js"></script>
</head>
<body>
<div id="boot">すっきりナビを開いています…</div>
<div id="setup" hidden></div>
<script>
(function(){
'use strict';
// ── スマホの中に残すもの（読めない・書けないときも画面は動く）──
const LS={ get(k){ try{ return JSON.parse(localStorage.getItem('pc_'+k)||'null'); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('pc_'+k,JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem('pc_'+k); }catch(e){} } };
// 送る待ちの列に入れる件（押した瞬間に画面が変わる件）。ほかの保存は、その場で送って結果を待つ
const QUEUED=['saveDone','delegateItem'];
const WRITES=['saveDone','delegateItem','undoDelegate','saveCaseMove','saveTabPref','saveStep','saveStepDate','saveCaseInfo','saveMsConfirm','finishCase','saveCaseStage'];
const RED_AFTER=5;   // 5回送って届かなければ赤で出す
let auth=LS.get('auth');     // { key, site, name }
let page=LS.get('page');     // { data, done, name, hasAi, admin, stamp, at, checked }
let TPL=null, frame=null, touched=false, pending=null, opened=false, polls=0, VARS={};
let st={ kind:'', text:'' };
const $=(id)=>document.getElementById(id);
const hm=(t)=>{ if(!t) return ''; const d=new Date(t), n=new Date(); const s=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); return (d.toDateString()===n.toDateString())?s:(d.getMonth()+1)+'/'+d.getDate()+' '+s; };
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const isStandalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
// 10/16：どこで開いているか（iPhone の Safari・Android の Chrome・LINE などアプリの中の画面）
function where(){
  const u=navigator.userAgent, ipad=/iPad/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1);
  const ios=/iPhone|iPod/.test(u)||ipad, android=/Android/.test(u), line=/\bLine\//.test(u);
  // other：iPhone の Safari 以外の閲覧アプリ（Chrome など）。inApp：LINE・Facebook・Instagram などアプリの中の画面
  const other=ios&&/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(u);
  const inApp=line||/FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|Twitter/.test(u)||(android&&/; wv\)/.test(u))||(ios&&!other&&!/Safari\//.test(u));
  // dots：Safari 26 から、共有ボタンは右下の「…」の中にあることが多い
  const v=+((u.match(/Version\/(\d+)/)||[])[1]||0);
  return { ios:ios, ipad:ipad, android:android, line:line, other:other, inApp:inApp, dots:v>=26 };
}
// ホーム画面に置く説明の絵（このファイルの中に描く）
const SHARE=(x,y,c)=>'<g transform="translate('+x+','+y+')" fill="none" stroke="'+c+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-5 -3H-10V13H10V-3H5"/><path d="M0 5V-13M-5.5 -7.5L0 -13L5.5 -7.5"/></g>';
const DOWN=(x,y1,y2)=>'<path d="M'+x+' '+y1+'V'+y2+'M'+(x-10)+' '+(y2-10)+'L'+x+' '+y2+'L'+(x+10)+' '+(y2-10)+'" fill="none" stroke="#5B8CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
const RING=(x,y)=>'<circle cx="'+x+'" cy="'+y+'" r="23" fill="rgba(91,140,255,.18)" stroke="#5B8CFF" stroke-width="2.5"/>';
const SVG=(h,body,label)=>'<svg class="pic" viewBox="0 0 320 '+h+'" role="img" aria-label="'+label+'">'+body+'</svg>';
const PIC={
  // 下のまん中に共有ボタンがある形
  bar:SVG(112,DOWN(160,4,38)+'<rect x="4" y="50" width="312" height="58" rx="12" fill="#1E2230" stroke="#2A2F3D"/>'
    +'<g fill="none" stroke="#6B7180" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M41 69L31 79L41 89"/><path d="M91 69L101 79L91 89"/><path d="M211 71q6.5-3 13 0q6.5-3 13 0v16q-6.5-3-13 0q-6.5-3-13 0zM224 71v16"/><rect x="280" y="74" width="14" height="14" rx="3"/><path d="M285 69h13v13"/></g>'
    +RING(160,79)+SHARE(160,79,'#5B8CFF'),'下のまん中の共有ボタン'),
  // 右下に「…」がある形（「…」→「共有」）
  dots:SVG(178,DOWN(286,4,38)+'<circle cx="34" cy="79" r="23" fill="#1E2230" stroke="#2A2F3D"/><path d="M38 70L29 79L38 88" fill="none" stroke="#6B7180" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<rect x="66" y="56" width="188" height="46" rx="23" fill="#1E2230" stroke="#2A2F3D"/><rect x="96" y="76" width="128" height="6" rx="3" fill="#3A4050"/>'
    +RING(286,79)+'<g fill="#5B8CFF"><circle cx="277" cy="79" r="3"/><circle cx="286" cy="79" r="3"/><circle cx="295" cy="79" r="3"/></g>'
    +'<path d="M286 106V122" fill="none" stroke="#5B8CFF" stroke-width="3" stroke-linecap="round"/>'
    +'<rect x="150" y="126" width="166" height="46" rx="12" fill="rgba(91,140,255,.18)" stroke="#5B8CFF" stroke-width="2"/>'+SHARE(180,149,'#EEF0F5')+'<text x="204" y="156" fill="#EEF0F5" font-size="18" font-weight="700">共有</text>','右下の「…」から共有'),
  // iPad：右上の共有ボタン
  pad:SVG(64,'<rect x="4" y="6" width="312" height="52" rx="12" fill="#1E2230" stroke="#2A2F3D"/><rect x="70" y="22" width="150" height="20" rx="10" fill="#2A2F3D"/>'+RING(266,32)+SHARE(266,32,'#5B8CFF'),'右上の共有ボタン'),
  // 共有の中の「ホーム画面に追加」
  add:SVG(150,'<rect x="4" y="4" width="312" height="142" rx="14" fill="#1E2230" stroke="#2A2F3D"/>'
    +'<text x="24" y="36" fill="#6B7180" font-size="16">コピー</text><path d="M4 51H316" stroke="#2A2F3D"/>'
    +'<rect x="10" y="56" width="300" height="40" rx="9" fill="rgba(91,140,255,.18)" stroke="#5B8CFF" stroke-width="2"/>'
    +'<text x="24" y="82" fill="#EEF0F5" font-size="17" font-weight="700">ホーム画面に追加</text>'
    +'<g fill="none" stroke="#EEF0F5" stroke-width="2.2" stroke-linecap="round"><rect x="274" y="65" width="22" height="22" rx="5"/><path d="M285 70V82M279 76H291"/></g>'
    +'<path d="M4 101H316" stroke="#2A2F3D"/><text x="24" y="130" fill="#6B7180" font-size="16">ブックマークを追加</text>','ホーム画面に追加'),
  // Android の Chrome：右上の「︙」→「ホーム画面に追加」
  and:SVG(176,'<rect x="4" y="4" width="312" height="50" rx="12" fill="#1E2230" stroke="#2A2F3D"/><rect x="20" y="17" width="226" height="24" rx="12" fill="#2A2F3D"/>'
    +RING(288,29)+'<g fill="#5B8CFF"><circle cx="288" cy="20" r="3"/><circle cx="288" cy="29" r="3"/><circle cx="288" cy="38" r="3"/></g>'
    +'<path d="M288 92V60M278 70L288 60L298 70" fill="none" stroke="#5B8CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<rect x="40" y="104" width="230" height="66" rx="12" fill="#1E2230" stroke="#2A2F3D"/>'
    +'<rect x="48" y="112" width="214" height="50" rx="9" fill="rgba(91,140,255,.18)" stroke="#5B8CFF" stroke-width="2"/>'
    +'<text x="64" y="143" fill="#EEF0F5" font-size="17" font-weight="700">ホーム画面に追加</text>','右上の「︙」からホーム画面に追加')
};
// Android の Chrome：「アプリを入れる」の合図を取っておく（押したら1回で入る）
let bip=null, installed=false, andPaint=null, skipInstall=!!LS.get('noinst');   // 「このまま使う」を押した端末には二度と出さない
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); bip=e; if(andPaint) andPaint(); });
addEventListener('appinstalled',()=>{ bip=null; installed=true; if(andPaint) andPaint(); });
// LINE から「ブラウザで開く」で来たときの印は、住所から外す
if(/[?&]openExternalBrowser=/.test(location.search)){ try{ const p=new URLSearchParams(location.search); p.delete('openExternalBrowser'); const q=p.toString(); history.replaceState(null,'',location.pathname+(q?'?'+q:'')+location.hash); }catch(e){} }

// ── 入口に頼む ──
class NetErr extends Error{}
async function post(body,ms,site){
  const url=CFG.gate[site||(auth&&auth.site)]; if(!url) throw new Error('入口がまだできていません');
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(),ms||45000);
  let r; try{ r=await fetch(url,{ method:'POST', body:JSON.stringify(body), signal:ac.signal }); }catch(e){ throw new NetErr('通信できませんでした'); } finally{ clearTimeout(t); }
  let j; try{ j=await r.json(); }catch(e){ throw new NetErr('答えが読めませんでした（'+r.status+'）'); }
  if(j&&j.ng==='key'){ lostKey(j.msg); throw new Error(j.msg||'鍵が使えません'); }
  return j;
}
function lostKey(msg){ LS.del('auth'); auth=null; showSetup(msg||'ここでの設定が使えなくなりました。はじめの設定をやり直してください'); }

// ── 送る待ちの列（押した件）──
const Q={ all(){ return LS.get('q')||[]; }, put(a){ LS.set('q',a); paint(); },
  add(op){ const a=Q.all(); a.push(op); Q.put(a); }, drop(id){ Q.put(Q.all().filter(o=>o.id!==id)); },
  bump(id){ Q.put(Q.all().map(o=>o.id===id?Object.assign(o,{n:(o.n||0)+1}):o)); } };
async function send(op){
  let j; try{ j=await post({ op:'call', key:auth.key, fn:op.fn, args:op.args, id:op.id }); }
  catch(e){ if(e instanceof NetErr){ Q.bump(op.id); throw e; } throw e; }
  // 10/15：入口が本体につながらなかったとき（Googleがときどき返すエラー）は、押した件を列に残して20秒ごとに送り直す（本体は同じ件を2回受けても1回分だけ動く）
  if(j.ng&&/^ペライチにつながりませんでした/.test(j.ng)){ Q.bump(op.id); throw new NetErr('つながりませんでした'); }
  Q.drop(op.id);
  if(j.ng){ const errs=LS.get('qerr')||[]; errs.push({ at:Date.now(), fn:op.fn, m:j.ng }); LS.set('qerr',errs.slice(-5)); throw new Error(j.ng); }
  return j.r;
}
let flushing=null;
function flush(){ if(flushing) return flushing; flushing=(async()=>{ for(const op of Q.all()){ try{ await send(op); }catch(e){ if(e instanceof NetErr) break; } } })().finally(()=>{ flushing=null; paint(); }); return flushing; }
setInterval(()=>{ if(!auth) return; if(st.kind==='err') check(false); else if(Q.all().length) flush(); },20000);   // 取れていない・送る待ちがあるときは20秒ごとにやり直す
addEventListener('online',()=>{ if(auth) check(false); });

// ── 画面（中の今のペライチ）から呼ばれる ──
let loggedOpen=false;
function call(fn,args){
  if(AS) return post({ op:'call', key:auth.key, fn:fn, args:args, id:'', as:AS.email },60000,'staff').then(j=>{ if(j.ng) throw new Error(j.msg||j.ng); return j.r; });   // 10/17：見るだけで見ている間（書き込む頼みは入口で断られる）
  if(fn==='logOpen'){ if(loggedOpen) return Promise.resolve(true); loggedOpen=true; args=[0,window.__shownMs||Math.round(performance.now())]; }   // 押してから中身が出るまで（アプリの時間）
  if(fn==='warmPage') return Promise.resolve(true);   // 作り置きはGoogleの見張りに任せる
  if(QUEUED.indexOf(fn)>=0){ const op={ id:rid(), fn:fn, args:args, at:Date.now(), n:0 }; Q.add(op);
    return send(op).catch(e=>{ if(e instanceof NetErr) return true; throw e; }); }   // 電波が無ければ列に残し、画面は押したまま
  const id=WRITES.indexOf(fn)>=0?rid():'';
  return post({ op:'call', key:auth.key, fn:fn, args:args, id:id }, fn==='askClaude'?120000:60000).then(j=>{ if(j.ng) throw new Error(j.ng); return j.r; },
    e=>{ throw (e instanceof NetErr)?new Error('通信がうまくいきませんでした。電波のよい所で、もう一度押してください'):e; });
}
// 「更新」：画面は今のまま触れる。裏でGoogleに作り直しを頼み、できたら入れ替える（触っている最中なら「新しい内容があります」）
let updating=false;
async function update(){ if(updating) return; updating=true; setSt('updating');
  try{ await post({ op:'call', key:auth.key, fn:'rebuild', args:[(page&&page.stamp)||''], id:'' },90000); }catch(e){}
  polls=0; st.kind=''; try{ await check(false); } finally{ updating=false; } }
// 10/17 統括の決定：社長のアプリで、社長のアカウントのまま、スタッフの画面を見るだけで見る（スタッフの入口に 社長の鍵＋as）。見ている間は書き込まない・最新の取り直しもしない。戻ると社長の画面
let AS=null;
async function viewAs(email){
  if(!email){ AS=null; if(page) await render(page, true); setSt('ok'); return; }
  AS={ email:email, name:'' }; setSt('checking');
  let j=null; try{ j=await post({ op:'page', key:auth.key, as:email },90000,'staff'); }catch(e){ j={ ng:'as', msg:e.message }; }
  if(!AS||AS.email!==email) return;
  if(!j||j.ng){ AS=null; if(page) await render(page); setSt('err',(j&&(j.msg||j.ng))||'開けませんでした'); return; }
  AS.name=(j.viewAs&&j.viewAs.name)||''; await render({ data:j.data, done:j.done, name:j.name, hasAi:j.hasAi, admin:false, stamp:'', ui:j.ui||'' }, true); setSt('ok'); }
window.__app={ vars:()=>VARS, call:call, refresh:(force)=>check(!!force), update:update, viewAs:viewAs };

// ── 上の帯の「何時の内容か」──
function setSt(kind,text){ st={ kind:kind, text:text||'' }; paint(); }
function paint(){
  if(!frame) return; let el; try{ el=frame.contentDocument.getElementById('appst'); }catch(e){} if(!el) return;
  const q=Q.all(), red=q.some(o=>(o.n||0)>=RED_AFTER), errs=LS.get('qerr')||[];
  const at=page&&(page.checked||page.at), old=at&&Date.now()-at>3600000;
  let t='', col='';
  // 第45.3版：上の帯は1行（「10/10（土） 16:14までのLINE」のあとに続ける）
  if(st.kind==='ok') t='・'+hm(at)+' 確認';
  else if(st.kind==='checking') t='・確認中…';
  else if(st.kind==='connecting') t='・つないでいます…';
  else if(st.kind==='updating') t='・更新中（そのまま使えます）';
  else if(st.kind==='building') t='・最新を作成中…';
  else if(st.kind==='new'){ t='・新しい内容あり（押すと入れ替え）'; col='#8FB5FF'; }
  else if(st.kind==='err'){ t='・最新を取れていません'+(st.text?'（'+st.text+'）':''); col=old?'#FFB020':''; }
  if(q.length){ t+='・送る待ち '+q.length+'件'; if(red){ t+='（送れていません）'; col='#FF6680'; } }
  if(errs.length){ t+='・送れなかった件 '+errs.length+'（'+errs[errs.length-1].m+'）'; col='#FF6680'; }
  // 10/15：上の帯はスマホの幅だと文字が切れて見えないので、取り直してもつながらないときだけ、画面のいちばん上に1行出す
  try{ const fd=frame.contentDocument; let nb=fd.getElementById('appnet');
    if(st.kind==='err'&&st.text==='少し時間をおいて開き直してください'){ if(!nb){ nb=fd.createElement('div'); nb.id='appnet'; nb.style.cssText='position:sticky;top:0;z-index:50;padding:8px 16px;background:#3a2a10;color:#FFB020;font-size:13.5px;line-height:1.5'; fd.body.prepend(nb); } nb.textContent='いま、つながりにくくなっています。少し時間をおいて開き直してください（表示は少し前の内容です）'; const rb=fd.createElement('button'); rb.textContent='開き直す'; rb.style.cssText='margin-left:10px;font:inherit;font-size:13.5px;font-weight:700;padding:4px 12px;border-radius:14px;border:0;background:#FFB020;color:#3a2a10'; rb.onclick=()=>location.reload(); nb.append(rb); }
    else if(nb) nb.remove(); }catch(e){}
  el.textContent=t; el.style.color=col; el.style.cursor=st.kind==='new'||errs.length?'pointer':'';
  el.onclick=()=>{ if(st.kind==='new'&&pending){ page=pending; pending=null; render(page); setSt('ok'); } else if(errs.length){ LS.del('qerr'); paint(); } };
}

// ── 中身を出す（新しい枠を裏で作って、できたら入れ替える＝ちらつかない）──
// 第47版：届いた中身の印（ui）が 'tabs' なら新しい画面（案件のタブ）。印が無ければ今の画面
async function tpl(ui){ const f='tabs.html';   /* 10/15：画面は tabs.html だけ */ TPL=TPL||{}; if(TPL[f]) return TPL[f]; const r=await fetch(f); TPL[f]=await r.text(); return TPL[f]; }
async function render(p,top){   // top：いちばん上から出す（見るだけの切り替えのとき）
  const html=(await tpl(p.ui)).replace('__APP_DATA__',()=>p.data);
  let done={}; try{ done=JSON.parse(p.done||'{}'); }catch(e){}
  Q.all().forEach(o=>{ if(o.fn!=='saveDone') return; const k=o.args[0], r=o.args[1]; if(r) done[k]=r; else delete done[k]; });   // 送る待ちの完了は、届く前でも画面では完了のまま（開き直しても戻らない）
  VARS={ __DONE:done, __AI:!!p.hasAi, __NAME:p.name||'', __URL:'', __OPEN:{ server:0, who:'' }, __USERS:null, __WARN:[], __STAMP:p.stamp||'', __STALE:false, __WARNLATER:!!p.admin, __VIEWONLY:!!AS, __ASLIST:!AS&&p.staff?p.staff:null };   // 10/17：見るだけ・社長が見られる人
  const f=document.createElement('iframe'); f.className='pg'; f.style.visibility='hidden'; f.setAttribute('title','すっきりナビ');
  f.onload=()=>{ const old=frame; let y=0; try{ y=old&&!top?old.contentWindow.scrollY:0; }catch(e){}
    frame=f; f.style.visibility=''; if(old) old.remove(); if(!window.__shownMs) window.__shownMs=Math.round(performance.now()); $('boot').hidden=true; try{ if(y) f.contentWindow.scrollTo(0,y); }catch(e){}
    touched=false; ['touchstart','mousedown','keydown','input'].forEach(ev=>{ try{ f.contentDocument.addEventListener(ev,()=>{ touched=true; },{ capture:true, passive:true }); }catch(e){} });
    paint(); };
  f.srcdoc=html; document.body.append(f);
}
// 受け取った中身が読めるか（途中で切れていないか）を、出す前に確かめる
function sane(p){ try{ const d=JSON.parse(p.data); JSON.parse(p.done||'{}'); return !!d&&typeof d==='object'; }catch(e){ return false; } }

// ── 最新を取りに行く ──
// 10/15（統括の判断）：Google側がときどき約50秒待たせて失敗を返す。前の画面を見せたまま「つないでいます…」と出し、5秒・15秒あけて取り直す（全部で3回）。それでもだめなときだけ知らせる
const GATE_NG=/^ペライチにつながりませんでした/, RETRY_GAP=[5000,15000]; let checking=false, again=false;
async function check(force){
  if(!auth||AS) return; if(checking){ if(force) again=true; return; } checking=true;   // 10/17：見るだけで見ている間は取り直さない
  try{
  if(!st.kind||st.kind==='err') setSt('checking');
  await flush();
  let j=null;
  for(let i=0;i<=RETRY_GAP.length;i++){
    if(i){ setSt('connecting'); await new Promise(f=>setTimeout(f,RETRY_GAP[i-1])); if(!auth) return; }
    let e0=null; try{ j=await post({ op:'page', key:auth.key, stamp:(page&&page.stamp)||'' },90000); }catch(e){ e0=e; j=null; }
    if(e0&&!(e0 instanceof NetErr)){ if(auth) setSt('err',e0.message); return; }
    if(j&&!(j.ng&&GATE_NG.test(j.ng))) break;
  }
  if(!j||(j.ng&&GATE_NG.test(j.ng))){ if(auth) setSt('err','少し時間をおいて開き直してください'); return; }
  if(j.ng){ setSt('err',j.ng); return; }
  if(j.same){ const uiChg=(j.ui||'')!==(page.ui||'')||(!!j.staff&&!page.staff); page.checked=j.at; page.ui=j.ui||''; if(j.staff) page.staff=j.staff; LS.set('page',page); setSt('ok'); if((force||uiChg)&&frame) render(page); return; }   // 第47版：印を付け外ししたら、中身が同じでも画面を入れ替える
  const np={ data:j.data, done:j.done, name:j.name, hasAi:j.hasAi, admin:j.admin, stamp:j.stamp, at:j.at, checked:j.at, ui:j.ui||'', staff:j.staff||(page&&page.staff)||null };
  if(!sane(np)){ setSt('err','受け取った中身が読めませんでした'); call('logClientError',['アプリ：受け取った中身が読めない']).catch(()=>{}); return; }
  if(j.stale&&page){ setSt('building'); if(polls++<10) setTimeout(()=>check(false),30000); return; }   // 前の控えは、手元より古いことがあるので入れ替えない
  LS.set('page',np);
  if(!page||force||!touched){ page=np; await render(page); setSt(j.stale?'building':'ok'); }
  else { pending=np; page.checked=j.at; setSt('new'); }
  if(j.stale&&polls++<10) setTimeout(()=>check(false),30000);
  } finally { checking=false; if(again){ again=false; setTimeout(()=>check(true),0); } }
}
// アプリに戻ってきたとき（1分以上たっていたら）も最新を見る
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ hiddenAt=Date.now(); return; } if(auth&&hiddenAt&&Date.now()-hiddenAt>60000){ polls=0; st.kind=''; check(false); } });

// ── はじめの設定（1回だけ。鍵を作る）──
function showSetup(msg){
  if(frame){ frame.remove(); frame=null; } $('boot').hidden=true; const S=$('setup'); S.hidden=false; S.textContent='';
  const h=(t,c,x)=>{ const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; };
  S.append(h('h1',null,'すっきりナビ はじめの設定'));
  if(msg) S.append(h('div','msg bad',msg));
  // 10/16 社長の決定：ホーム画面に置く説明を絵で出す。ホーム画面から開いている人には出さない
  andPaint=null; S.style.paddingBottom='';
  const env=where(), pic=(k)=>{ const d=document.createElement('div'); d.innerHTML=PIC[k]; return d.firstChild; };
  const appRow=()=>{ const r=h('div','app'), im=document.createElement('img'); im.src='icon-180.png'; im.alt=''; r.append(im, h('b',null,'すっきりナビ')); return r; };
  if(!isStandalone()&&(env.inApp||env.other)){
    // LINE などアプリの中の画面：Safari（Android は Chrome）で開き直してもらう
    const br=env.ios?'Safari':'Chrome', url=location.origin+location.pathname;
    S.firstChild.textContent='すっきりナビ';
    const b=h('div','box'); b.append(h('div','big',br+'で開いてください'), h('div','note','この画面からは、ホーム画面に置けません'));
    if(env.line){ const o=h('button',null,br+'で開く'); o.onclick=()=>{ location.href=url+'?openExternalBrowser=1'; }; b.append(o); }
    const cp=h('button',env.line?'sub':null,'住所を写す'), m2=h('div','msg'), u=h('input','url'); u.readOnly=true; u.value=url;
    cp.onclick=async()=>{ let ok=false; try{ await navigator.clipboard.writeText(url); ok=true; }catch(e){}
      if(!ok){ try{ u.focus(); u.select(); ok=document.execCommand('copy'); }catch(e){} }
      m2.className=ok?'msg ok':'msg bad'; m2.textContent=ok?'写しました。'+br+'を開いて、住所の欄に貼りつけてください':'写せませんでした。下の住所を長押しして写してください'; };
    b.append(cp, m2, u);
    if(env.inApp&&!env.line) b.append(h('div','note','画面の右上か下の印から「ブラウザで開く」でも開けます'));
    S.append(b); return; }
  if(env.ios&&!isStandalone()){
    // iPhone・iPad の Safari：① 共有 → ② ホーム画面に追加 → ③ ホーム画面から開く
    S.firstChild.textContent='すっきりナビ'; S.append(h('div','lead','まず、ホーム画面に置きます'));
    const b1=h('div','box');
    if(env.ipad) b1.append(h('div','big','① 右上の共有ボタンを押す'), pic('pad'));
    else if(env.dots) b1.append(h('div','big','① 右下の「…」→「共有」'), pic('dots'), h('div','note or','下のまん中に共有ボタンがあるときは、それを押す'));
    else b1.append(h('div','big','① 下の共有ボタンを押す'), pic('bar'), h('div','note or','右下に「…」があるときは、「…」→「共有」'));
    const b2=h('div','box'); b2.append(h('div','big','② 「ホーム画面に追加」を押す'), pic('add'), h('div','note','見つからないときは、下へずらす'));
    const b3=h('div','box'); b3.append(h('div','big','③ ホーム画面から開く'), appRow());
    S.append(b1,b2,b3);
    if(!env.ipad){ const p=h('div','point'); p.setAttribute('aria-hidden','true'); p.innerHTML='ここ<svg width="28" height="30" viewBox="0 0 28 30"><path d="M14 2V26M4 16L14 26L24 16" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      if(env.dots){ p.style.left='auto'; p.style.right='18px'; p.style.transform='none'; }
      S.append(p); S.style.paddingBottom='96px'; }
    return; }
  if(env.android&&!isStandalone()&&!skipInstall){
    // Android の Chrome：「アプリを入れる」ボタン（合図が来ないときは「︙」→「ホーム画面に追加」）
    S.firstChild.textContent='すっきりナビ';
    const b=h('div','box'), area=h('div'); b.append(h('div','big','まず、アプリを入れます'), area); S.append(b);
    andPaint=()=>{ area.textContent='';
      if(installed){ area.append(h('div','big ok','入りました'), appRow(), h('div','note','ホーム画面の「すっきりナビ」から開いてください')); return; }
      if(bip){ const ib=h('button',null,'アプリを入れる'); ib.onclick=async()=>{ const e=bip; bip=null; try{ await e.prompt(); const c=await e.userChoice; if(c&&c.outcome==='accepted') installed=true; }catch(x){} andPaint(); }; area.append(ib); return; }
      area.append(h('div',null,'右上の「︙」→「ホーム画面に追加」'), pic('and'), h('div','note','「アプリをインストール」と出ることもあります')); };
    andPaint();
    const go=h('a','note','このまま使う ›'); go.href='#'; go.style.cssText='display:inline-block;margin-top:18px;color:var(--sub)'; go.onclick=e=>{ e.preventDefault(); skipInstall=true; LS.set('noinst',1); showSetup(msg); }; S.append(go);
    return; }
  S.firstChild.textContent='すっきりナビをはじめる';   // 10/13 社長：全体のソフトの共通の入口（名前は統括/全体設計.md の社長の決定）
  const m=h('div','msg');
  const start=(site)=>{ const a=new Uint8Array(16); crypto.getRandomValues(a); const token=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');
    LS.set('pair',{ token:token, site:site, at:Date.now() }); window.open(CFG.main[site]+'?pair='+token,'_blank'); waitPair(); };
  const b1=h('button',null,'はじめる'); b1.onclick=()=>{ start(CFG.main.all?'all':'staff'); later(); }; S.append(b1);   // 10/13 社長「全員同じ動作に」：ボタンは1つ。開いた先がアカウントを見て、社長の場所かスタッフの場所かを決める
  S.append(h('div','note','開いた画面で会社のアカウントを選ぶと、自動で始まります。'), m);
  // 数字で設定する（前の形。待ち札がうまくいかないとき用）
  const dt=h('details'); dt.style.marginTop='24px'; dt.append(h('summary','note','うまくいかないとき：数字で設定する'));
  const inp=h('input'); inp.inputMode='numeric'; inp.maxLength=6; inp.placeholder='000000'; inp.autocomplete='one-time-code';
  const go=h('button','sub','数字で設定する'); dt.append(h('div','note','Googleの画面のいちばん下「アプリにする（数字を出す）」で出た6けた'),inp,go); S.append(dt);
  dt.hidden=true; function later(){ setTimeout(()=>{ dt.hidden=false; },45000); }   // 10/13：うまくいかないときの道は、はじめるを押して45秒たってから出す（最初の画面はボタン1つ）
  go.onclick=async()=>{ const code=inp.value.replace(/\D/g,''); if(code.length!==6){ m.className='msg bad'; m.textContent='6けたの数字を打ってください'; return; }
    go.disabled=true; m.className='msg'; m.textContent='確かめています…';
    try{ await pairDone(await post({ op:'pair', code:code, dev:devName() },45000,code.charAt(0)==='9'?'owner':'staff'), code.charAt(0)==='9'?'owner':'staff'); }
    catch(e){ go.disabled=false; m.className='msg bad'; m.textContent=e.message||'設定できませんでした'; } };
  const pw=LS.get('pair'); if(pw&&Date.now()-pw.at<600000){ waitPair(); later(); }
}
// 第49.6版：画面に出す名前（社長は「胡内（社長）」）
const who=()=>!auth||!auth.name?'':auth.name==='社長'?'胡内（社長）の':auth.name+'さんの';
const devName=()=>(navigator.userAgent.match(/iPhone|iPad|Android|Macintosh|Windows/)||['?'])[0];
async function pairDone(j,site){
  if(!j||!j.ok) throw new Error((j&&j.ng)||'設定できませんでした');
  auth={ key:j.key, site:j.site||site, name:j.name||'' }; LS.set('auth',auth); LS.del('pair'); LS.del('page'); page=null;
  $('setup').hidden=true; $('boot').hidden=false; $('boot').textContent=who()+'すっきりナビを受け取っています…（はじめは少し時間がかかります）'; check(true);
}
// 待ち札：今のペライチで「このスマホで使う」が押されるのを、2秒ごとに聞きに行く（10分まで）
let pairT=null;
function waitPair(){
  // 第49.6版：ほかの画面（同じパソコンの別の画面）が先に鍵を受け取っていたら、その場で私の仕事を出す（戻る操作をさせない）
  clearTimeout(pairT); const pw=LS.get('pair'), m=document.querySelector('#setup .msg'); if(!pw){ if(!auth&&LS.get('auth')) location.reload(); return; }
  if(Date.now()-pw.at>600000){ LS.del('pair'); if(m){ m.className='msg bad'; m.textContent='10分を過ぎました。もう一度「はじめる」を押してください'; } return; }
  if(m){ m.className='msg'; m.textContent='つながるのを待っています…'; }
  // 10/13：待ち札は、スタッフの場所と社長の場所の両方に聞く（どちらで「このスマホで使う」が押されたかは、アカウントで決まる）
  const ask=site=>post({ op:'pair', token:pw.token, dev:devName() },20000,site).then(j=>({site,j}),e=>({site,e}));
  Promise.all(['staff','owner'].map(ask)).then(rs=>{ const ok=rs.find(r=>r.j&&!r.j.wait); if(ok) return pairDone(ok.j,ok.site);
      if(rs.some(r=>r.j&&r.j.wait)||rs.every(r=>r.e instanceof NetErr)){ pairT=setTimeout(waitPair,2000); return; }
      const er=rs.find(r=>r.e); throw er?er.e:new Error('設定できませんでした'); })
    .catch(e=>{ if(e instanceof NetErr){ pairT=setTimeout(waitPair,3000); return; } LS.del('pair'); if(m){ m.className='msg bad'; m.textContent=e.message||'設定できませんでした'; } });
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!auth&&LS.get('pair')) waitPair(); });

// ── 始め ──
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').then(r=>{ try{ r.update(); }catch(e){} }).catch(()=>{}); }
// 新しい版の画面が届いたとき、はじめの設定の途中なら、その場で新しい画面に切り替える（使っている最中は切り替えない＝次に開いたときから）
if('serviceWorker' in navigator){ let once=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!once&&(!auth||!touched)){ once=true; location.reload(); } }); }   // 第47版：新しい版が届いたら、触っていなければその場で入れ替える（閉じて開き直さなくてよい）
if(!auth||!CFG.gate[auth.site]){ showSetup(); return; }
if(page&&sane(page)){ setSt('checking'); render(page).then(()=>check(false)); }
else { page=null; $('boot').textContent=who()+'すっきりナビを受け取っています…'; check(true); }
})();
</script>
